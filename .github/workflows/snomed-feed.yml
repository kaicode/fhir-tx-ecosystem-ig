name: Publish SNOMED CT test subontology syndication feed

on:
  push:
    branches: [main]
    paths:
      - 'tx-source/snomed/**'
      - '.github/workflows/snomed-feed.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release zip
        id: zip
        run: |
          set -euo pipefail
          mkdir -p site/snomed-feed
          ZIP_NAME="snomed-tx-test-subontology.zip"
          cd tx-source
          zip -r -X "../site/snomed-feed/${ZIP_NAME}" snomed -x '.*'
          cd ..
          echo "name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "length=$(stat -c%s "site/snomed-feed/${ZIP_NAME}")" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "site/snomed-feed/${ZIP_NAME}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate syndication feed
        env:
          ZIP_NAME: ${{ steps.zip.outputs.name }}
          ZIP_LENGTH: ${{ steps.zip.outputs.length }}
          ZIP_MD5: ${{ steps.zip.outputs.md5 }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/snomed-feed
        run: |
          set -euo pipefail
          UPDATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > site/snomed-feed/feed.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <feed xmlns="http://www.w3.org/2005/Atom" xmlns:ncts="http://ns.electronichealth.net.au/ncts/syndication/asf/extensions/1.0.0" xmlns:sct="http://snomed.info/syndication/sct-extension/1.0.0">
            <title>TX Test SNOMED CT Dummy Syndication Feed</title>
            <link rel="alternate" type="application/atom+xml" href="http://ns.electronichealth.net.au/ncts/syndication/asf/profile/1.0.0" />
            <id>urn:uuid:5c26c3ca-c21c-476e-b0a4-096679529f2e</id>
            <generator>fhir-tx-ecosystem-ig</generator>
            <updated>${UPDATED}</updated>
            <ncts:atomSyndicationFormatProfile>http://ns.electronichealth.net.au/ncts/syndication/asf/profile/1.0.0</ncts:atomSyndicationFormatProfile>
            <entry>
              <title>TX Test SNOMED Subontology</title>
              <link rel="alternate" type="application/zip" href="${PAGES_BASE_URL}/${ZIP_NAME}" length="${ZIP_LENGTH}" sct:md5Hash="${ZIP_MD5}" />
              <category term="SCT_RF2_SNAPSHOT" label="SNOMED CT RF2 Snapshot" scheme="http://ns.electronichealth.net.au/ncts/syndication/asf/scheme/1.0.0" />
              <author>
                <name>TX Test</name>
                <uri>https://github.com/HL7/fhir-tx-ecosystem-ig</uri>
                <email>info@snomed.org</email>
              </author>
              <id>urn:uuid:19d51b8b-11d0-4667-b562-bc875e19222f</id>
              <rights>© International Health Terminology Standards Development Organisation 2002-2026.  All rights reserved.  SNOMED CT® was originally created by the College of American Pathologists.  "SNOMED" and "SNOMED CT" are registered trademarks of International Health Terminology Standards Development Organisation, trading as SNOMED International.</rights>
              <updated>${UPDATED}</updated>
              <published>${UPDATED}</published>
              <summary>SNOMED Subontology to support TX test cases</summary>
              <ncts:contentItemIdentifier>http://snomed.info/xsct/31000003106</ncts:contentItemIdentifier>
              <ncts:contentItemVersion>http://snomed.info/xsct/31000003106/version/20250909</ncts:contentItemVersion>
            </entry>
          </feed>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: snomed-feed

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: snomed-feed
